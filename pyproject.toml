[project]
name = "firescroll"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pylint.messages_control]
disable = [
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-class-docstring",
    "import-error",
    "import-outside-toplevel",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "unused-argument",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
