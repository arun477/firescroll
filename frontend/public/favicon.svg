<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="40%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#fff5cc"/>
    </linearGradient>
    <linearGradient id="scroll-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fe2c55"/>
      <stop offset="100%" stop-color="#ff4500"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#333" stroke-width="0.5"/>
  <!-- Outer flame -->
  <path d="M32 6C25 17,17 22,17 34c0,9,6.5,17,15,17s15-8,15-17c0-6-4-13-8-17c0,8-4,12-6,12s-4-4-2-12z" fill="url(#flame)" opacity="0.95"/>
  <!-- Inner flame glow -->
  <path d="M32 20c-3,6-6,10-6,15c0,4,2.5,7,6,7s6-3,6-7c0-3-2-7-4-9c0,4-1,6-2,6s-2-2-1-6z" fill="url(#inner)"/>
  <!-- Scroll indicator - bottom bar -->
  <rect x="20" y="53" width="24" height="3" rx="1.5" fill="url(#scroll-g)" opacity="0.9"/>
  <!-- Scroll dots -->
  <circle cx="26" cy="58" r="1.2" fill="#fe2c55" opacity="0.5"/>
  <circle cx="32" cy="58" r="1.5" fill="#fe2c55"/>
  <circle cx="38" cy="58" r="1.2" fill="#fe2c55" opacity="0.5"/>
</svg>
