<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FireScroll</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: -apple-system, sans-serif;
}

.feed {
  height: 100vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}

.card {
  height: 100vh;
  scroll-snap-align: start;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.card video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.card-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  color: white;
}

.card-overlay .topic {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}

.card-overlay .meta {
  font-size: 13px;
  color: #aaa;
}

.sidebar {
  position: absolute;
  right: 12px;
  bottom: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.sidebar .btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 20px;
  backdrop-filter: blur(10px);
}

.sidebar .btn-label {
  font-size: 11px;
  color: #ddd;
  margin-top: 2px;
}

.loading {
  color: #666;
  font-size: 16px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.progress-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 3px;
  background: #fe2c55;
  transition: width 0.3s;
  z-index: 10;
}
</style>
</head>
<body>

<div class="feed" id="feed">
  <div class="loading" id="loading">Loading feed...</div>
</div>

<script>
const feed = document.getElementById('feed');
const loading = document.getElementById('loading');

async function loadFeed() {
  const res = await fetch('/api/feed');
  const items = await res.json();

  if (items.length === 0) {
    loading.textContent = 'No videos yet. Run batch_generate.py first!';
    return;
  }

  loading.remove();

  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';

    const likes = Math.floor(Math.random() * 50 + 10);
    const comments = Math.floor(Math.random() * 5 + 1);
    const dur = Math.round(item.duration);

    card.innerHTML = `
      <div class="progress-bar" id="prog-${idx}"></div>
      <video
        id="vid-${idx}"
        src="${item.video_url}"
        playsinline autoplay muted
        preload="${idx < 3 ? 'auto' : 'metadata'}"
        poster="${item.thumb_url || ''}"
      ></video>
      <div class="sidebar">
        <div>
          <div class="btn">&#9825;</div>
          <div class="btn-label">${likes}K</div>
        </div>
        <div>
          <div class="btn">&#128172;</div>
          <div class="btn-label">${comments}K</div>
        </div>
        <div>
          <div class="btn">&#8618;</div>
          <div class="btn-label">Share</div>
        </div>
      </div>
      <div class="card-overlay">
        <div class="topic">${item.series} — Part ${item.segment_id}</div>
        <div class="meta">${item.mode} · ${item.caption} · ${dur}s</div>
      </div>
    `;
    feed.appendChild(card);
  });

  setupObserver();
}

function scrollToCard(idx) {
  const cards = document.querySelectorAll('.card');
  if (idx < cards.length) {
    cards[idx].scrollIntoView({ behavior: 'smooth' });
  }
}

function setupObserver() {
  const videos = document.querySelectorAll('video');

  videos.forEach(video => {
    video.addEventListener('ended', () => {
      const idx = parseInt(video.id.replace('vid-', ''));
      scrollToCard(idx + 1);
    });
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting) {
        video.muted = false;
        video.currentTime = 0;
        video.play().catch(() => {});
        trackProgress(video);
      } else {
        video.pause();
      }
    });
  }, { threshold: 0.6 });

  videos.forEach(v => observer.observe(v));

  if (videos.length > 0) {
    const first = videos[0];
    first.play().catch(() => {
      feed.addEventListener('click', () => {
        first.muted = false;
        first.play();
      }, { once: true });
    });
    trackProgress(first);
  }
}

function trackProgress(video) {
  const idx = video.id.replace('vid-', '');
  const bar = document.getElementById('prog-' + idx);
  if (!bar) return;

  const update = () => {
    if (video.paused) return;
    const pct = (video.currentTime / video.duration) * 100;
    bar.style.width = pct + '%';
    requestAnimationFrame(update);
  };
  requestAnimationFrame(update);
}

loadFeed();
</script>
</body>
</html>
