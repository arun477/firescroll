services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8500:8500"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./assets:/app/assets
      - ./.env:/app/.env
      - dbdata:/app/dbdata
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3500:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata:
