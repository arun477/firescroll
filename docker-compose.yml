services:
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8500:8500"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./assets:/app/assets
      - ./.env:/app/.env
      - dbdata:/app/dbdata
      - ./media_library:/app/media_library
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - REMOTION_API_URL=http://remotion-studio:3600
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A celery_app worker --loglevel=info --pool=solo -Q celery
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./assets:/app/assets
      - ./.env:/app/.env
      - dbdata:/app/dbdata
      - ./media_library:/app/media_library
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - REMOTION_API_URL=http://remotion-studio:3600
    depends_on:
      - redis
      - remotion-studio
    restart: unless-stopped

  chat-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A celery_app worker --loglevel=info --pool=solo -Q chat -c 1
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - dbdata:/app/dbdata
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  remotion-studio:
    build:
      context: ./remotion-studio
      dockerfile: Dockerfile
    volumes:
      - ./output:/app/output
    environment:
      - NODE_ENV=production
      - OUTPUT_DIR=/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3500:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dbdata:
  redis_data:
